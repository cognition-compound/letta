[pytest]
testpaths = tests performance_tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::pytest.PytestRemovedIn9Warning
    # suppresses the warnings we see with the event_loop fixture
    ignore:.*is asynchronous and explicitly requests the "event_loop" fixture. Asynchronous fixtures and test functions should use "asyncio.get_running_loop\(\)" instead.*
markers =
    # Test categorization markers
    unit: mark test as unit test (no external dependencies, no database, no network)
    integration: mark test as integration test (requires database, external services, or complex setup)
    database: mark test as requiring database access (PostgreSQL or SQLite)
    external_api: mark test as requiring external API calls (OpenAI, Anthropic, etc.)
    slow: mark test as slow running (>5 seconds execution time)
    
    # Existing provider-specific markers
    openai_basic: Tests for OpenAI endpoints
    anthropic_basic: Tests for Anthropic endpoints
    azure_basic: Tests for Azure endpoints
    gemini_basic: Tests for Gemini endpoints
    
    # Sandbox-related markers
    local_sandbox: mark test as part of local sandbox tests
    e2b_sandbox: mark test as part of E2B sandbox tests
    
    # Additional markers for Redis and async client tests
    redis_flag: mark test as requiring Redis configuration
    async_client_test: mark test as async client test (may be skipped by default)