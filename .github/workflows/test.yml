name: Test Suite

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: letta
          POSTGRES_PASSWORD: letta
          POSTGRES_DB: letta_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install -E dev -E server -E postgres -E tests

      - name: Set up database
        env:
          LETTA_PG_URI: postgresql+pg8000://letta:letta@localhost:5432/letta_test
        run: |
          # Wait for PostgreSQL to be ready
          poetry run python -c "
          import time
          import psycopg2
          from psycopg2 import OperationalError
          
          for i in range(30):
              try:
                  conn = psycopg2.connect(
                      host='localhost',
                      port=5432,
                      user='letta',
                      password='letta',
                      database='letta_test'
                  )
                  conn.close()
                  print('PostgreSQL is ready!')
                  break
              except OperationalError:
                  print(f'Waiting for PostgreSQL... ({i+1}/30)')
                  time.sleep(1)
          else:
              raise Exception('PostgreSQL failed to start')
          "
          
          # Create pgvector extension
          poetry run python -c "
          import psycopg2
          conn = psycopg2.connect(
              host='localhost',
              port=5432,
              user='letta',
              password='letta',
              database='letta_test'
          )
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute('CREATE EXTENSION IF NOT EXISTS vector;')
          print('Created pgvector extension')
          cur.close()
          conn.close()
          "
          
          # Run database migrations
          poetry run alembic upgrade head

      - name: Run tests
        env:
          LETTA_PG_URI: postgresql+pg8000://letta:letta@localhost:5432/letta_test
          LETTA_SERVER_PASSWORD: test_password
          HOST: 127.0.0.1
          PORT: 8283
        run: |
          # Skip tests that require external API keys but run database tests
          poetry run pytest tests/ performance_tests/ \
            --json-report --json-report-file=test-results.json \
            --tb=short \
            -v \
            -x \
            --maxfail=10
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.json
          retention-days: 30

      - name: Test Summary
        if: always()
        run: |
          if [ -f test-results.json ]; then
            echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
            echo "Tests completed. See artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
          fi